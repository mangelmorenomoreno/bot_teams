_schema-version: "3.3"
ID: pptio-good-movement-type
description: CRUD Fiori Elements para GOODS_MOVEMENT_TYPE_CONFIG
version: 1.0.0

parameters:
  enable-parallel-deployments: true
  deploy_mode: html5-repo

build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm install
        - npx cds build --production

modules:
  - name: pptio-good-movement-type-srv
    type: nodejs
    path: gen/srv
    parameters:
      instances: 1
      buildpack: nodejs_buildpack
    provides:
      - name: srv-api
        properties:
          srv-url: ${default-url}
    requires:
      - name: pptio-good-movement-type-auth
      - name: pptio-good-movement-type-db

  - name: pptio-good-movement-type-db-deployer
    type: hdb
    path: gen/db
    parameters:
      buildpack: nodejs_buildpack
    requires:
      - name: pptio-good-movement-type-db
      - name: pptio-med-db-schema-mgr-hdi
        group: SERVICE_REPLACEMENTS
        properties:
          key: pptio-med-db-schema-mgr-hdi
          service: ~{the-service-name}

  - name: goodsmovementtype
    type: html5
    path: app/goods.movement.type
    build-parameters:
      builder: custom
      commands:
        - npm install
        - npm run build:cf
      build-result: dist
      supported-platforms: []

  - name: pptio-good-movement-type-app-content
    type: com.sap.application.content
    path: .
    requires:
      - name: pptio-good-movement-type-html5-service
        parameters:
          content-target: true
    build-parameters:
      build-result: resources
      requires:
        - name: goodsmovementtype
          artifacts:
            - comlacardiogoodsmovementtype.zip
          target-path: resources/

  - name: pptio-good-movement-type-destination-content
    type: com.sap.application.content
    requires:
      - name: pptio-good-movement-type-destination-service
        parameters:
          content-target: true
      - name: pptio-good-movement-type-html5-service
        parameters:
          service-key:
            name: pptio-good-movement-type-html5-service-key
      - name: pptio-good-movement-type-auth
        parameters:
          service-key:
            name: pptio-good-movement-type-auth-key
    parameters:
      content:
        subaccount:
          existing_destinations_policy: update
          destinations:
            - Name: pptio-good-movement-type-html5-repository
              ServiceInstanceName: pptio-good-movement-type-html5-service
              ServiceKeyName: pptio-good-movement-type-html5-service-key
              sap.cloud.service: lacardio.goodsmovementtype
            - Name: pptio-good-movement-type-auth
              Authentication: OAuth2UserTokenExchange
              ServiceInstanceName: pptio-good-movement-type-auth
              ServiceKeyName: pptio-good-movement-type-auth-key
              sap.cloud.service: lacardio.goodsmovementtype
    build-parameters:
      no-source: true

resources:
  - name: pptio-good-movement-type-db
    type: com.sap.xs.hdi-container
    parameters:
      service: hana
      service-plan: hdi-shared

  - name: pptio-med-db-schema-mgr-hdi
    type: org.cloudfoundry.existing-service
    parameters:
      service-name: pptio-med-db-schema-mgr-hdi
    properties:
      the-service-name: ${service-name}

  - name: pptio-good-movement-type-auth
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
      path: ./xs-security.json
      config:
        xsappname: pptio-good-movement-type-${space}
        tenant-mode: dedicated

  - name: pptio-good-movement-type-html5-service
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-plan: app-host

  - name: pptio-good-movement-type-destination-service
    type: org.cloudfoundry.managed-service
    requires:
      - name: srv-api
    parameters:
      service: destination
      service-plan: lite
      config:
        version: 1.0.0
        HTML5Runtime_enabled: true
        init_data:
          instance:
            existing_destinations_policy: update
            destinations:
              - Name: pptio-good-movement-type-srv
                Description: CAP service - Goods Movement Type
                URL: ~{srv-api/srv-url}
                Type: HTTP
                ProxyType: Internet
                Authentication: NoAuthentication
                HTML5.DynamicDestination: true
                HTML5.ForwardAuthToken: true
              - Name: ui5
                URL: https://ui5.sap.com
                Type: HTTP
                ProxyType: Internet
                Authentication: NoAuthentication
